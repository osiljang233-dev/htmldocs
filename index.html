.tab-btn.active{background:var(--paper);color:var(--ink);border-color:var(--ink2);
  box-shadow:0 2px 0 -1px var(--paper)}
.tab-count{font-size:11px;font-weight:800;background:#0000000d;border-radius:999px;

.tab-btn.active .tab-count{background:#fab00533;color:#8a6603}
.cat-section{border:1.6px solid var(--ink2);
  border-radius:2px 13px 12px 13px/2px 12px 14px 12px;background:var(--paper);
  padding:18px 18px 20px}
.cat-section.hidden{display:none}
.section-title{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--ink3);margin-bottom:12px}
.doc-list{list-style:none}
.doc-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;
  border:1.5px solid #4A443C88;
  border-radius:255px 12px 225px 12px/12px 225px 12px 255px;
  margin-bottom:9px;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s}
.doc-list li:nth-child(even) .doc-item{border-radius:12px 225px 12px 255px/225px 12px 255px 12px}
.doc-item:hover{border-color:var(--blue);transform:translateY(-1px)}
.doc-icon{font-size:22px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.doc-meta{font-size:12.5px;color:var(--ink3)}
.doc-arrow{font-size:15px;color:var(--ink3);flex:none}
.doc-item:hover .doc-arrow{color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;

.tag-report{color:#8a6603;border-color:var(--warn);background:#fab00522}
.tag-compare{color:#1d7a35;border-color:var(--ok);background:#40c05722}
.footer{color:var(--ink3);font-size:12.5px;margin-top:20px;

  { file: 'kkongbudae-site-strategy-20260716.html', title: '꽁부대 사이트 개선 전략 보고서', icon: '🏗️', tag: 'report', cat: 'Season 1', desc: '사이트 개선 전략' },
  { file: 'lineage-adena-report-20260713.html',  title: '리니지 클래식 이해 & 아데나 거래 시장 분석',                 icon: '⚔️', tag: 'report', cat: 'Season 1',  desc: '아데나 경제 구조 · 거래 플랫폼 · 시세 · 이용자 특성' },
];

const tagLabel = { plan: '기획', report: '보고서', compare: '비교' };

const CAT_ORDER = ['X/Thread', 'Instagram', 'ETC', 'Season 1'];

docs.sort((a, b) => {
  const da = a.file.match(/(\d{8})/)?.[1] || '0';
  const db = b.file.match(/(\d{8})/)?.[1] || '0';
  return db.localeCompare(da);
});

function parseDate(filename) {
  const m = filename.match(/(\d{4})(\d{2})(\d{2})/);
  return m ? `${m[1]}.${m[2]}.${m[3]}` : '';
}

const groups = {};
docs.forEach(d => { const c = d.cat || 'ETC'; (groups[c] = groups[c] || []).push(d); });
const order = CAT_ORDER
  .concat(Object.keys(groups).filter(c => !CAT_ORDER.includes(c)));

const tabsRoot = document.getElementById('tabs');
const root = document.getElementById('cats');

function selectTab(cat) {
  tabsRoot.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  root.querySelectorAll('.cat-section').forEach(s => s.classList.toggle('hidden', s.dataset.cat !== cat));
}

order.forEach(cat => {
  const items = groups[cat] || [];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab-btn';
  btn.dataset.cat = cat;
  btn.innerHTML = `${cat}<span class="tab-count">${items.length}</span>`;
  btn.addEventListener('click', () => selectTab(cat));
  tabsRoot.appendChild(btn);

  const section = document.createElement('div');
  section.className = 'cat-section';
  section.dataset.cat = cat;
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `${cat} (${items.length})`;
  section.appendChild(title);
  const ul = document.createElement('ul');
  ul.className = 'doc-list';
  items.forEach(doc => {
    const date = parseDate(doc.file);
    const li = document.createElement('li');
    li.innerHTML = `
      <a class="doc-item" href="./${doc.file}">
        <div class="doc-icon">${doc.icon}</div>
        <div class="doc-info">
          <div class="doc-title">${doc.title} <span class="tag tag-${doc.tag}">${tagLabel[doc.tag]}</span></div>
          <div class="doc-meta">${date}${doc.desc ? ' · ' + doc.desc : ''}</div>
        </div>
        <div class="doc-arrow">→</div>
      </a>`;
    ul.appendChild(li);
  });
  section.appendChild(ul);
  root.appendChild(section);
});

selectTab(order.includes('Season 1') ? 'Season 1' : order[0]);
